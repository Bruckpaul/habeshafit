name: habeshafit
description: A personal workout tracker – portfolio project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  go_router: ^14.2.3
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  confetti: ^0.7.0
  intl: ^0.19.0
  image_picker: ^1.1.2  # only used for placeholder, not fully implemented

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/exercises.json
